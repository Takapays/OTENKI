name: Instagram auto post

on:
  schedule:
    # 12:10 JST every day. GitHub Actions cron uses UTC.
    - cron: '10 3 * * *'
  workflow_dispatch:

concurrency:
  group: traten-instagram-auto-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CACHE_TOKEN: ${{ secrets.NATIONAL_CACHE_REFRESH_TOKEN }}
      BASE_URL: https://otenki.onrender.com
    steps:
      - name: Validate scheduler secret
        run: |
          set -euo pipefail
          test -n "$CACHE_TOKEN" || { echo "NATIONAL_CACHE_REFRESH_TOKEN secret is missing"; exit 1; }

      - name: Prepare seven carousel days
        run: |
          set -euo pipefail
          for OFFSET in 0 1 2 3 4 5 6; do
            echo "Preparing carousel day offset=$OFFSET"
            BODY="$(curl --fail-with-body --silent --show-error \
              --retry 1 --retry-delay 10 --retry-all-errors --max-time 1000 \
              -X POST \
              -H "X-Traten-Cache-Token: $CACHE_TOKEN" \
              -H "Content-Type: application/json" \
              --data "{\"offset\":$OFFSET}" \
              "$BASE_URL/api/instagram/auto-post-prepare-day")"
            echo "$BODY"
            BODY="$BODY" python3 -c 'import json,os,sys; j=json.loads(os.environ["BODY"]); print("prepared",j.get("date"),j.get("count")); sys.exit(0 if j.get("ok") else 1)'
          done

      - name: Publish Instagram carousel
        run: |
          set -euo pipefail
          BODY="$(curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 15 --retry-all-errors --max-time 1200 \
            -X POST \
            -H "X-Traten-Cache-Token: $CACHE_TOKEN" \
            "$BASE_URL/api/instagram/auto-post-publish")"
          echo "$BODY"
          BODY="$BODY" python3 -c 'import json,os,sys; j=json.loads(os.environ["BODY"]); print("Instagram auto post",j.get("date"),"ok="+str(j.get("ok"))); sys.exit(0 if j.get("ok") else 1)'
