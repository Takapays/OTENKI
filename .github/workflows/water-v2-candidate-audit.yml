name: Water V2 candidate audit (Alps + Yatsugatake)

on:
  workflow_dispatch:
    inputs:
      max_mountains:
        description: 'Mountains to audit this run (resume skips completed)'
        required: false
        default: '8'

permissions:
  contents: write

concurrency:
  group: traten-water-v2-candidate-audit
  cancel-in-progress: false

jobs:
  candidate-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate target route geometry and public seeds
        run: python audit_water_v2_candidates.py --dry-run

      - name: Prepare dedicated water-candidates branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin water-candidates || true
          rm -rf /tmp/traten-water-candidates
          if git show-ref --verify --quiet refs/remotes/origin/water-candidates; then
            git worktree add -B water-candidates /tmp/traten-water-candidates origin/water-candidates
          else
            git worktree add -b water-candidates /tmp/traten-water-candidates HEAD
          fi
          cp audit_water_v2_candidates.py audit_water_300.py app.js resource-mountain-data.js water-v2-public-seeds.csv /tmp/traten-water-candidates/

      - name: Discover next candidate mountains
        shell: bash
        env:
          MAX_MOUNTAINS: ${{ inputs.max_mountains }}
        run: |
          set -euo pipefail
          cd /tmp/traten-water-candidates
          python audit_water_v2_candidates.py \
            --resume \
            --max-mountains "${MAX_MOUNTAINS:-8}" \
            --timeout 12 \
            --attempts 3 \
            --sleep 0.7

      - name: Save candidate queue to dedicated branch
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/traten-water-candidates
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f water-v2-candidates.json WATER_V2_CANDIDATES.csv WATER_V2_CANDIDATES.md
          if git diff --cached --quiet; then
            echo "No candidate queue changes."
          else
            git commit -m "chore: refresh Water V2 candidates [skip ci]"
            git push origin HEAD:water-candidates
          fi

      - name: Upload review files
        uses: actions/upload-artifact@v6
        with:
          name: water-v2-candidates
          path: |
            /tmp/traten-water-candidates/WATER_V2_CANDIDATES.csv
            /tmp/traten-water-candidates/WATER_V2_CANDIDATES.md
            /tmp/traten-water-candidates/water-v2-candidates.json
          if-no-files-found: error
