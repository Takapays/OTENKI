name: Refresh nationwide cache

on:
  schedule:
    # V1.6.2: maintain the next 7 days for all 300 mountains.
    # Render checkpoints forecast rows every 25 mountains; only stale/missing rows are fetched.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

concurrency:
  group: traten-national-cache-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wake Render and refresh stale nationwide cache
        env:
          CACHE_TOKEN: ${{ secrets.TRATEN_CACHE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CACHE_TOKEN"
          curl --fail-with-body --show-error --silent \
            --retry 2 --retry-all-errors --retry-delay 15 --max-time 840 \
            -X POST \
            -H "X-Traten-Cache-Token: $CACHE_TOKEN" \
            https://otenki.onrender.com/api/national-outlook/refresh-cache
