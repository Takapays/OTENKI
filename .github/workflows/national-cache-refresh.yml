name: 全国キャッシュを更新する

on:
  schedule:
    # 15分ごと。GitHub Actions cronはUTC。
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

concurrency:
  group: traten-national-cache-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      CACHE_TOKEN: ${{ secrets.NATIONAL_CACHE_REFRESH_TOKEN }}
    steps:
      - name: Validate scheduler secret
        run: |
          set -euo pipefail
          test -n "$CACHE_TOKEN" || { echo "NATIONAL_CACHE_REFRESH_TOKEN secret is missing"; exit 1; }

      - name: Wake Render and refresh stale nationwide cache
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --silent \
            --max-time 300 \
            -X POST \
            -H "X-Traten-Cache-Token: $CACHE_TOKEN" \
            https://otenki.onrender.com/api/national-outlook/refresh-cache
