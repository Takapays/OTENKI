name: Refresh nationwide cache

on:
  schedule:
    # Check hourly. The server seeds tomorrow's 100 mountains if missing, and refreshes rows only after the 4-hour TTL.
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wake Render and refresh stale nationwide cache
        env:
          CACHE_TOKEN: ${{ secrets.TRATEN_CACHE_REFRESH_TOKEN }}
        run: |
          test -n "$CACHE_TOKEN"
          curl --fail-with-body --show-error --silent \
            --retry 2 --retry-delay 10 --max-time 900 \
            -X POST \
            -H "X-Traten-Cache-Token: $CACHE_TOKEN" \
            https://otenki.onrender.com/api/national-outlook/refresh-cache
