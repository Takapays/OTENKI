name: Refresh water source cache

on:
  workflow_dispatch:
  schedule:
    - cron: '23 18 * * 1'
  push:
    branches: [ main, master ]
    paths:
      - 'audit_water_300.py'
      - '.github/workflows/water-source-audit.yml'

permissions:
  contents: write

concurrency:
  group: traten-water-source-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate all 300 mountains have fixed audit points
        run: python audit_water_300.py --dry-run

      - name: Audit in resumable 25-mountain chunks
        shell: bash
        run: |
          set -u
          for START in $(seq 0 25 275); do
            echo "=== chunk start=${START} ==="
            python audit_water_300.py --start "$START" --limit 25 --resume --sleep 1.2 --timeout 10 --attempts 2

            # Persist every completed chunk. A later timeout/failure therefore does not discard earlier work.
            if ! git diff --quiet -- water-mountain-cache.json; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add water-mountain-cache.json
              git commit -m "chore: checkpoint water audit ${START} [skip ci]"
              git push
            fi
          done

      - name: Retry unresolved mountains once
        run: python audit_water_300.py --errors-only --resume --sleep 2.0 --timeout 12 --attempts 2

      - name: Summarize result
        run: |
          python - <<'PY'
          import json
          d=json.load(open('water-mountain-cache.json',encoding='utf-8'))
          rows=d['mountains']
          checked=sum(v.get('checked') is True for v in rows.values())
          available=sum(v.get('available') is True for v in rows.values())
          errors=sum(not v.get('checked') for v in rows.values())
          print('checked',checked,'/',len(rows))
          print('available',available)
          print('unresolved',errors)
          PY

      - name: Commit final refreshed cache
        run: |
          if git diff --quiet -- water-mountain-cache.json; then
            echo "No final cache changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add water-mountain-cache.json
          git commit -m "chore: refresh water source cache [skip ci]"
          git push
