name: Refresh water source cache

on:
  workflow_dispatch:
  schedule:
    # Small single-mountain queries every 3 hours. Confirmed mountains are skipped forever.
    - cron: '23 */3 * * *'
  push:
    branches: [ main, master ]
    paths:
      - 'audit_water_300.py'
      - '.github/workflows/water-source-audit.yml'

permissions:
  contents: write

concurrency:
  group: traten-water-source-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate all 300 mountains have fixed audit points
        run: python audit_water_300.py --dry-run

      - name: Audit only the next unresolved mountains
        run: python audit_water_300.py --resume --batch-size 1 --max-mountains 10 --sleep 0.8 --timeout 7 --attempts 3

      - name: Summarize result
        run: |
          python - <<'PY'
          import json
          d=json.load(open('water-mountain-cache.json',encoding='utf-8'))
          rows=d['mountains']
          checked=sum(v.get('checked') is True for v in rows.values())
          available=sum(v.get('available') is True for v in rows.values())
          unresolved=sum(v.get('checked') is not True for v in rows.values())
          print('checked',checked,'/',len(rows))
          print('available',available)
          print('unresolved',unresolved)
          print('Incremental mode: confirmed rows are preserved; failed rows rotate to the back of the retry queue.')
          PY

      - name: Commit refreshed cache
        run: |
          if git diff --quiet -- water-mountain-cache.json; then
            echo "No cache changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add water-mountain-cache.json
          git commit -m "chore: refresh water source cache [skip ci]"
          git push
