services:
  - type: web
    name: mountain-weather-decision
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt && python -m playwright install chromium
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120 server:app
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: UPSTREAM_TIMEOUT
        value: "45"
      - key: OVERPASS_TIMEOUT
        value: "70"
      - key: CACHE_TTL
        value: "120"
      - key: OPENMETEO_PROXY_CACHE_TTL
        value: "1800"
      - key: NATIONAL_OUTLOOK_CACHE_TTL
        value: "14400"
      - key: NATIONAL_OUTLOOK_STALE_TTL
        value: "86400"
      - key: NATIONAL_OUTLOOK_REFRESH_INTERVAL
        value: "900"
      - key: NATIONAL_100_ROLLING_AUTO_CACHE
        value: "1"
      - key: NATIONAL_100_ROLLING_DAYS
        value: "7"
      - key: NATIONAL_100_ROLLING_DATES_PER_CYCLE
        value: "1"
      - key: NATIONAL_CACHE_REFRESH_TOKEN
        sync: false
      # Instagram nationwide bot. Keep auto-post disabled until Meta
      # credentials are configured and a manual test post succeeds.
      - key: INSTAGRAM_AUTO_POST
        value: "0"
      - key: INSTAGRAM_AUTO_POST_HOUR_JST
        value: "17"
      - key: INSTAGRAM_USER_ID
        sync: false
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: INSTAGRAM_IMAGE_SECRET
        sync: false
      - key: INSTAGRAM_GRAPH_API_VERSION
        value: "v24.0"
      - key: INSTAGRAM_GRAPH_BASE_URL
        value: "https://graph.instagram.com"
      - key: PUBLIC_BASE_URL
        value: "https://otenki.onrender.com"
      - key: TRAIL_GRAPH_CACHE_MAX
        value: "2"
      - key: TRAIL_BUILD_TIMEOUT
        value: "180"
      - key: USAGE_LOG_STDOUT
        value: "1"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: USAGE_DASHBOARD_USERNAME
        value: "admin"
      - key: USAGE_DASHBOARD_PASSWORD
        sync: false
