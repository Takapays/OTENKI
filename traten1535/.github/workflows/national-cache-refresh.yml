name: Refresh nationwide cache

on:
  schedule:
    # Wake Render every 15 minutes. V1.5.8 maintains tomorrow through seven days ahead for the 100 Famous Mountains; one forecast date is processed per refresh cycle and only rows past the 4-hour TTL are fetched.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wake Render and refresh stale nationwide cache
        env:
          CACHE_TOKEN: ${{ secrets.TRATEN_CACHE_REFRESH_TOKEN }}
        run: |
          test -n "$CACHE_TOKEN"
          curl --fail-with-body --show-error --silent \
            --retry 2 --retry-delay 10 --max-time 900 \
            -X POST \
            -H "X-Traten-Cache-Token: $CACHE_TOKEN" \
            https://otenki.onrender.com/api/national-outlook/refresh-cache
